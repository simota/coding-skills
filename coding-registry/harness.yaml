# Budgets and vocabulary. The validator reads thresholds from here and nowhere
# else: a number copied into prose becomes a second definition that drifts.
#
# Raising a limit is the last resort. Try merging, deleting, compressing, and
# relocating first (VALUES.md §3).

# One declaration. Every namespaced name derives from it, and a rule checks
# that they still agree: the skill prefix, the shared directory, and the label
# every document carries on its first line.
set: coding
prefix: coding-             # <set>-
shared_dir: _coding         # _<set>

# Every directory this set owns carries the set name — `<set>-*` or `_<set>` —
# so that copying any of them into a shared skills directory cannot collide.
# Prefixing only what gets installed would rest on a claim about every future
# install script; a sibling set's `cp -R quality-* _common <skills dir>` is what
# that claim looks like once it is wrong.
#
# Carrying the prefix is not what makes something installable: a skill is a
# directory holding a SKILL.md, and only those are ever linked.
# `skills/` holds everything the CLI reads. The set's own directories still
# carry the set name.
skills_dir: skills
platform_dirs: [.git, .github, .claude, skills, docs]   # named by the platform, not by this set

limits:
  skill_md_lines: 130           # measured max at adoption: 95. Raised from 120 when the
                                # prediction block was delivered into every skill: the
                                # registration is worthless in a file nobody opens before
                                # editing, and it is seven lines in eight skills
  description_chars: 200        # the listing truncates past this
  playbook_lines: 300           # measured max: 106
  playbooks_per_skill: 8        # measured max: 3
  shared_file_lines: 100        # measured max: 93
  shared_lines_total: 500       # measured: 403 before PREDICTION.md, 486 after. The set
                                # carries a pre-registration contract the sibling sets do
                                # not, and it is the one thing here that cannot be
                                # reconstructed after the fact
  skills_max: 10                # 8 in use, 2 spare for demand found in use
  routes_max: 12
  route_stages_max: 6
  repo_md_lines_total: 4200     # measured: 3380 after the reference layer landed.
                                # Raised from 3200 because reference/ carries no line
                                # budget of its own but is counted here; the ceiling
                                # is the family's planning-set figure, not a blank cheque.

# A listing under this many skills does not need packs. Crossing it is the
# trigger to split the set into named subsets, not a reason to delete skills.
listing:
  packs_needed_above: 20

permission_classes:
  read-only:
    tools: "Read, Grep, Glob, Bash"
    writes: false
  doc-write:
    tools: "Read, Grep, Glob, Bash, Write"
    writes: true
  full:
    tools: "Read, Grep, Glob, Bash, Write, Edit"
    writes: true

# A description naming a neighbour spends listing budget on a competitor's name
# and puts that name into the material the engine matches against.
# Boundaries live in capabilities.yaml `not:` instead.
forbidden_description_terms:
  - "Not for"
  - "not for"
  - "instead of"
  - "rather than"

# All three CLIs read the same SKILL.md, so any of them may be the one running
# — the producing engine is a property of the run, not of this file. An earlier
# version pinned `produced_by: claude` here, which quietly approved `checker:
# codex` on a run that was itself codex.
#
# Detection was tried and does not work: codex launched from inside Claude Code
# inherits `CLAUDECODE` and `CLAUDE_CODE_*`, so a nested run reads as its parent.
# The caller states which engine is running; when it does not, the runner stops.
engines:
  runs_on: [claude, codex, agy]     # two or more, or no run can check itself out

# What a refuting engine attacks in this domain, and what counts as having broken
# the claim. The tool is the same in every set (`coding-tools/refute.py`); the lens is
# not, and a refuter with no domain framing is a second opinion rather than an
# adversary.
refutation:
  lens: |
    A claimed defect in code. Go for the citation before the reasoning: open the
    named line and check it says what the claim says it says. Then ask whether the
    path is reachable at all, and whether the failure needs a precondition the code
    already prevents. Most false findings are a real pattern cited at the wrong place.
  refuted_when: >-
    the cited line does not contain what is claimed, the path cannot be reached,
    or the failure needs a state the code already rules out

# Tools a skill may run. Each is linked individually into the skills that can run
# it; the tools directory is never linked whole, because a skill holding `Bash`
# and all of it could edit the harness it is part of. A rule checks each link is
# present exactly where the skill's class grants a shell, so a missing one is a
# failure rather than an oversight.
linked_tools:
  refute.py: all

vocabulary:
  patterns: [linear, loop, report-only]
  prediction_outcomes: [hit, miss, void]
  checkers: [other-engine]
  evidence_levels: [executed, inspected, asserted]
  residual_classes: [BLOCKED, OUT-OF-SCOPE, DEFERRED, UNVERIFIED]
  statuses: [DONE, PARTIAL, BLOCKED]
  tiers: [T0, T1, T2]

document_labels: [contract, guidance, deferred]
# Patterns match the path from the repository root, so they carry `skills/`.
label_by_path:
  "skills/_coding/ROUTING.md": guidance
  "skills/_coding/*.md": contract
  "skills/*/SKILL.md": contract
  "skills/*/playbooks/*.md": guidance
  "skills/*/reference/*.md": deferred

# Content that goes stale belongs outside the budget, not in a playbook.
# The validator flags these patterns in playbooks.
# reference/ carries no line budget; it carries these headers instead. The layer
# holds what the model approximates rather than recalls — exact command
# semantics, recoverability, oracle provenance — so every page states when it was
# last checked and against what.
reference_headers: ["Purpose:", "Read when:", "Verified:"]
# A `Verified:` date records that someone looked once, and a date has no failure
# mode. V31 requires the line to name what re-checks it — or to say plainly that
# nothing does. An unchecked page is fine; an unchecked page that reads like a
# checked one is not.
verified_markers:
  - "no automated check"      # the honest admission, and the common case
  - "by running"
  - "produced by running"
  - "confirmed by running"
  - "performing the operation"
  - "quoted from"
  - "recomputed"
  - "re-run by"
  - "re-runs"
  - "re-derives"
  - "re-checked"
  - "re-verified"
  - "make figures"
  - "holds every"
  - "holds the two"
  - "holds them to"


# Paths that belong to the host project, not to this set.
external_paths: [".agents/", "CLAUDE.md", "AGENTS.md", "GEMINI.md", "settings.json"]

rot_patterns:
  - '\b(19|20)\d{2}-\d{2}\b'
  - '\bv\d+\.\d+(\.\d+)?\b'

# Blocks copied verbatim into every SKILL.md. Naming a shared file is not the
# same as reaching it: a contract kept only in _coding/ goes unread on most
# launches. render.py writes these back; the validator checks they match.
# The one mechanism this set has that its siblings do not. The rule that checks
# it is identical in all six sets; this block is the whole difference, which is
# what keeps six copies of the validator from becoming six dialects.
#
# `required_of` names the skills that owe the mechanism — a skill causing no
# observable change has nothing to predict, and naming the ones that do is what
# keeps the rule from being performed everywhere and meant nowhere.
# `own_word` is the substring each of them must carry outside the delivered
# block: the rule is stated for all, and owned in each skill's own words.
signature:
  name: prediction
  contract: PREDICTION.md
  vocabulary: prediction_outcomes
  required_of: [coding-debug, coding-implement, coding-refactor, coding-test]
  own_word: redict

delivered:
  sizing:  { section: "Before starting" }
  predict: { section: "Before starting" }
  values:  { section: "Decide first" }
  report:  { section: "Verify with" }
