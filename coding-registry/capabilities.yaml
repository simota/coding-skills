# What each skill owns, what it does not, and the words that select it.
#
# `not:` is the only place a boundary is written. Putting boundaries in
# descriptions means every skill added rewrites its neighbours, and the
# marginal cost of an addition stops being O(1).
#
# `signals` are the words a request actually uses. Each must appear literally
# in that skill's description: the listing carries name and description only,
# so a signal that lives here and nowhere else never reaches the engine.

coding-explore:
  class: read-only
  does: [where-is, how-it-works, blast-radius, structure, history, dependencies]
  not:
    - what: "something that is broken"
      go: coding-debug
    - what: "deciding a design once the code is understood"
      go: coding-plan
  signals: [where, how a path works, who calls, blast radius, structure, history, unfamiliar]

coding-plan:
  class: doc-write
  does: [interfaces, data-model, error-design, state-design, build-order, options]
  not:
    - what: "locating code that already exists"
      go: coding-explore
    - what: "writing the code once the shape is settled"
      go: coding-implement
    - what: "attacking a plan that is already written"
      go: coding-preflight
  signals: [interfaces, signatures, data model, error and state design, state design, build order, between options, trade-off]

coding-preflight:
  class: doc-write
  does: [plan-views, usage-view, structure-view, data-flow-view, sequence-view, failure-view, build-order-view, design-flaw-hunt]
  not:
    - what: "deciding the shape, or revising the plan a flaw was found in"
      go: coding-plan
    - what: "judging code that already exists"
      go: coding-review
  signals: [preflight, implementation plan, visualise, diagram, data flow, failure paths, design flaw, written plan]

coding-implement:
  class: full
  does: [feature, endpoint, screen, business-logic, cli, integration, upgrade, performance]
  not:
    - what: "cleanup that preserves behaviour"
      go: coding-refactor
    - what: "a defect in code that already ran"
      go: coding-debug
    - what: "a slowdown in code that used to be fast"
      go: coding-debug
  signals: [feature, endpoint, screen, business logic, CLI, integration, dependency upgrade, performance]

coding-debug:
  class: full
  does: [reproduce, isolate, root-cause, minimal-fix, regression-diagnosis]
  not:
    - what: "reading code that works"
      go: coding-explore
    - what: "standalone regression-test work beyond the current fix"
      go: coding-test
  signals: [broken, bug, reproduce, root cause, failing, why is this broken, regression, error]

coding-refactor:
  class: full
  does: [extract, rename, duplication, dead-code, module-boundary, mechanical-migration]
  not:
    - what: "any change a caller can observe"
      go: coding-implement
    - what: "reading a diff for defects"
      go: coding-review
    - what: "a schema or data migration, or a dependency upgrade and the call-site changes it forces"
      go: coding-implement
  signals: [refactor, extract, rename, extraction, duplication, dead code, module boundaries, mechanical migration, hard to work with]

coding-test:
  class: full
  does: [test-cases, coverage, regression-test, flaky-repair, suite-repair, test-design]
  not:
    - what: "diagnosing why the code is wrong"
      go: coding-debug
    - what: "checks of the current implementation, diagnosis, or refactor, including retained guards"
      go: "the skill making that run"
  signals: [test cases, coverage, regression test, regression tests, assert, flaky, unreliable suite]

coding-review:
  class: read-only
  does: [defect-finding, correctness, boundaries, security, over-engineering]
  not:
    - what: "writing the check that catches the finding"
      go: coding-test
    - what: "a defect observed at runtime"
      go: coding-debug
    - what: "a plan with no code yet"
      go: coding-preflight
  signals: [review, defects, diff, correctness, boundaries, security, more code than]

coding-ship:
  class: full
  does: [commit-granularity, commit-message, history, branch, merge-order, split, changelog, release]
  not:
    - what: "fixing code so a commit looks tidy"
      go: coding-implement
    - what: "judging whether the change is correct"
      go: coding-review
  signals: [commit, history shape, merge order, splitting, oversized pull request, pr, changelog, release notes, squash, rebase]

coding-toolbox:
  class: full
  does: [find-tool, keep-script, tool-header, tool-index, tool-upkeep, prune-tools]
  not:
    - what: "a check of the product's own behaviour, kept in its suite"
      go: coding-test
    - what: "a command or script the product itself ships"
      go: coding-implement
    - what: "a defect in the product that a tool brought to light"
      go: coding-debug
  signals: [toolbox, helper script, throwaway script, reuse, stale tools, between runs]

coding-setup:
  class: full
  does: [readiness-audit, agent-rules, feature-map, verify-script, ci-gate, review-gate, gate-proof]
  not:
    - what: "the product's own tests, written so the gate has something to run"
      go: coding-test
    - what: "restructuring product code so it fits the rules written about it"
      go: coding-refactor
    - what: "a script one run wrote for itself and the next could reuse"
      go: coding-toolbox
  signals: [agent-ready, AGENTS.md, feature map, verify script, CI gates, CODEOWNERS, pull request template, PR template, branch protection, required checks]
