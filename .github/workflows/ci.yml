name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]   # the oldest supported, and the newest in use
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pyyaml==6.0.2
      - name: Static rules
        run: python3 coding-tools/validate.py
      - name: Every rule still fires
        run: python3 coding-tools/test_validate.py
      - name: The tools stop where they say they stop
        run: python3 coding-tools/test_tools.py
      - name: Documented git behaviour still holds
        run: python3 coding-tools/figures_check.py
      - name: Delivered blocks are current
        run: |
          python3 coding-tools/render.py
          git diff --exit-code || {
            echo "SKILL.md delivery blocks are stale — run: make render"; exit 1; }
